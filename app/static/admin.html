<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>愿石 WishStone - 管理后台</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>愿石 WishStone 管理后台</h1>
        <p class="subtitle">输入管理 Token 后可查看统计、审核会话、修改 Prompt</p>

        <div class="row">
          <input id="adminToken" type="password" placeholder="X-Admin-Token" autocomplete="off" />
          <button id="loadBtn" class="btn">加载数据</button>
        </div>
        <p class="meta">管理接口默认关闭。先在服务端设置 <code>ADMIN_TOKEN</code>。</p>

        <section class="block">
          <h2>统计概览</h2>
          <div id="stats" class="meta">未加载</div>
        </section>

        <section class="block">
          <h2>场景配置</h2><label for="adminVenue">场馆</label><select id="adminVenue"></select><p class="meta">场景目录来自 VENUE_CONFIG。当前祝福使用本地模板；下方 Prompt 配置保存备用，尚未用于 LLM 生成。</p>
          <div class="row">
            <input id="roleName" placeholder="角色名" />
          </div>
          <div class="row">
            <textarea id="systemPrompt" rows="3" placeholder="系统提示词"></textarea>
          </div>
          <div class="row">
            <textarea id="responseStyle" rows="2" placeholder="回复风格"></textarea>
          </div>
          <div class="row">
            <textarea id="forbiddenRules" rows="2" placeholder="禁止规则"></textarea>
          </div>
          <div class="row">
            <button id="savePromptBtn" class="btn">保存 Prompt</button>
          </div>
          <p id="promptStatus" class="meta"></p>
        </section>

        <section class="block">
          <h2>会话审核</h2>
          <div id="sessions"></div>
        </section>
      </section>
    </main>
    <script src="/admin.js"></script>
  </body>
</html>
